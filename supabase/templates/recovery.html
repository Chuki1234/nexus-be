<!doctype html>
<html lang="vi">
  <body style="margin: 0; padding: 24px; background: #0d1117; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #e6edf3;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 440px; margin: 0 auto;">
      <tr>
        <td style="padding-bottom: 16px;">
          <h1 style="margin: 0; font-size: 20px; font-weight: 700; color: #ffffff;">Đặt lại mật khẩu Nexus</h1>
        </td>
      </tr>
      <tr>
        <td style="font-size: 14px; line-height: 22px; color: #b0b8c1;">
          Bạn vừa yêu cầu khôi phục mật khẩu. Nhập mã xác thực dưới đây vào màn hình
          "Quên mật khẩu" để tiếp tục:
        </td>
      </tr>
      <tr>
        <td style="padding: 24px 0;">
          <div style="font-size: 34px; font-weight: 700; letter-spacing: 10px; text-align: center; color: #2dd4bf; background: #161b22; border-radius: 12px; padding: 20px 0;">
            {{ .Token }}
          </div>
        </td>
      </tr>
      <tr>
        <td style="font-size: 13px; line-height: 20px; color: #7d8590;">
          Mã có hiệu lực trong 1 giờ. Nếu bạn không yêu cầu đổi mật khẩu, hãy bỏ qua
          email này — tài khoản của bạn vẫn an toàn.
        </td>
      </tr>
    </table>
  </body>
</html>
